[project]
name = "cutleast-core-lib"
version = "1.3.0"
description = "A core library used by my projects"
authors = [{ name = "cutleast", email = "cutleast@gmail.com" }]
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "comtypes ; sys_platform == 'win32'",
    "darkdetect",
    "jstyleson",
    "material-color-utilities",
    "py7zr",
    "pydantic",
    "pyside6",
    "qtawesome",
    "rarfile",
    "requests",
    "semantic-version",
    "virtual-glob",
]

[build-system]
requires = ["hatchling", "pyside6"]
build-backend = "hatchling.build"

[tool.pyrefly]
project-includes = [
    "src/**/*.py",
    "tests/**/*.py",
]
project-excludes = [
    "**/__pycache__",
    "**/*.old",
    "**/resources_rc.py",
    "**/node_modules",
    "**/.*",
    ".venv",
]
site-package-path = ["./stubs"]
infer-with-first-use = false

[tool.pyrefly.errors]
bad-override = false
deprecated = "warn"
inconsistent-inheritance = "warn"
implicit-any-lambda = "ignore"
implicit-any-parameter = "error"
implicit-any-type-argument = "ignore"
incompatible-comparison = "info"
missing-import = "error"
missing-override-decorator = "warn"
no-access = "warn"
non-exhaustive-match = "ignore"
redundant-cast = "info"
redundant-condition = "info"
unknown-argument-type = "ignore"
unknown-attribute-type = "ignore"
unknown-variable-type = "ignore"
unnecessary-comparison = "info"
untyped-class-decorator = "error"
untyped-function-decorator = "error"
untyped-import = "ignore"

[tool.hatch.build.targets.wheel]
packages = ["src/cutleast_core_lib"]

[tool.hatch.build.targets.sdist]
include = ["/res", "/scripts", "/src/cutleast_core_lib", "/hatch_build.py"]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[dependency-groups]
dev = [
    "pyfakefs",
    "pyrefly",
    "pytest",
    "pytest-cov",
    "pytest-mock",
    "pytest-qt",
    "requests-mock",
    "ruff",
    "types-requests",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
log_cli = true
log_cli_level = "DEBUG"
log_cli_format = "[%(asctime)s.%(msecs)03d][%(levelname)s][%(name)s.%(funcName)s]: %(message)s"
